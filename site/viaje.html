<script>
(function(){
  var V=VDV, id=new URLSearchParams(location.search).get("id"), s=V.porId(id), m=document.getElementById("main");
  if(!s){m.innerHTML='<section><div class="wrap"><a class="back" href="index.html#paquetes">← Ver todos los viajes</a><h1 class="h2">No encontramos ese viaje</h1><p class="lead">Puede que la salida ya haya pasado. Escribinos y te contamos qué hay disponible.</p><p style="margin-top:18px"><a class="btn" data-wa="Hola! Quiero consultar por un viaje" href="#">Escribinos por WhatsApp</a></p></div></section>';VDVapp.reveal();document.querySelectorAll("[data-wa]").forEach(function(a){a.href=V.waLink(a.dataset.wa)});return;}

  var vencida=V.diasHasta(s.fecha)<0, sold=s.estado==="agotado"||vencida, dias=V.diasHasta(s.fecha);
  var estado=vencida?"Salida finalizada":(V.estadoTxt[s.estado]||"Cupos disponibles");

  '<section><div class="wrap"><a class="back" href="index.html#paquetes">← Ver todos los viajes</a><div class="vj">'+
  '<div class="rv"><span class="kicker">El viaje</span><h2 class="h2">'+V.esc(s.destino)+'</h2><p class="lead" style="max-width:60ch">'+V.esc(s.detalle)+'.</p>'+
  '<h3 style="margin:30px 0 12px;font-weight:800">Qué incluye</h3><div class="tags" style="gap:10px">'+s.incluye.map(function(i){return '<span style="font-size:14px;padding:7px 14px">'+V.esc(i)+'</span>'}).join('')+'</div>'+
  '<h3 style="margin:30px 0 12px;font-weight:800">Cómo reservar</h3><p class="lead">Escribinos por WhatsApp con el viaje elegido y la cantidad de pasajeros. Te confirmamos cupos, formas de pago y seña. La misma persona te acompaña hasta la salida.</p></div>'+
  '<aside class="box rv"><span class="badge '+s.estado+'" style="position:static;display:inline-block;margin-bottom:12px">'+estado+'</span>'+
  '<div class="pr">'+V.esc(s.precio)+'</div><p class="price"><small>'+V.esc(s.nota)+'</small></p>'+
  '<ul style="margin:18px 0"><li>Salida: '+V.esc(s.dia)+(dias>=0?' (faltan '+dias+' días)':'')+'</li><li>Destino: '+V.esc(s.lugar)+'</li>'+s.incluye.map(function(i){return '<li>'+V.esc(i)+'</li>'}).join('')+'</ul>'+
  (sold?'<a class="btn out" style="width:100%" data-wa="Hola! La salida a '+V.esc(s.destino)+' figura agotada. ¿Me avisan si se libera un lugar?" href="#">Avisame si se libera un lugar</a>':'<a class="btn" style="width:100%" data-wa="'+V.esc(msg)+'" href="#">Consultar por WhatsApp</a>')+

})();
